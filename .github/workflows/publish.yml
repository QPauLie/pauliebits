name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # build everything, but do not upload

jobs:
  build_wheels:
    name: Wheels ${{ matrix.os }} (${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,    archs: x86_64}
          - {os: ubuntu-24.04-arm, archs: aarch64}
          - {os: windows-latest,   archs: AMD64}
          - {os: macos-13,         archs: x86_64}
          - {os: macos-latest,     archs: arm64}
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_TEST_COMMAND: 'python -c "import pauliebits, pauliebits.util; print(pauliebits.__version__)"'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.archs }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pauliebits
    permissions:
      id-token: write   # trusted publishing to PyPI
      contents: write   # attach the same files to the GitHub release
    steps:
      - name: Collect wheels and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
